name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest test_main.py -v

  validate-terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: cloud-lab/azure
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: cloud-lab/azure
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: cloud-lab/azure
        run: terraform validate

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: app
        run: docker build -t lab-devops-api:${{ github.sha }} .

  deploy:
    name: Trigger Jenkins Deploy
    runs-on: ubuntu-latest
    needs: [test, validate-terraform, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Jenkins pipeline
        run: |
          curl -f -X POST \
            "${{ secrets.JENKINS_URL }}/job/lab-devops/build" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"
